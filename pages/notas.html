<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FAF6EF">
<title>Notas · Registro Estudiantil</title>

<!-- Bootstrap + iconos: primero desde libs/ (tu repo); si falta, CDN -->
<link rel="stylesheet" href="../libs/bootstrap.min.css"
      onerror="this.onerror=null;this.href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css';">
<link rel="stylesheet" href="../libs/bootstrap-icons.min.css"
      onerror="this.onerror=null;this.href='https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css';">
<!-- Tipografías -->
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#FAF6EF; --ink:#221E33; --ink-soft:rgba(34,30,51,.6);
    --line:rgba(34,30,51,.10); --paper:#FFFFFF;
    --celeste:#C9E5F6;  --celeste-ink:#123C59;
    --naranja:#FFB459;  --naranja-ink:#59300A;  --naranja-deep:#D9770E;
    --lila:#DED6FF;     --lila-ink:#3B2A80;     --lila-deep:#6B4BD6;
    --turquesa:#A8E8D6; --turquesa-ink:#0B4B3D;
    --morado:#5A3EA6;   --morado-ink:#F4EFFF;   --morado-deep:#443077;
    --rojo:#B42318;     --verde:#178F72;
  }

  /* ============ LAYOUT GENERAL (reutilizable) ============ */
  .wrap-fluid{
    width:100%; max-width:1920px; margin:0 auto;
    padding-left:clamp(12px, 3vw, 44px);
    padding-right:clamp(12px, 3vw, 44px);
  }
  .site-header{ padding:clamp(18px, 2.6vw, 30px) 0 12px; }
  .brand-title{ font-size:clamp(1.2rem, 1rem + 0.9vw, 1.75rem); }
  .brand-sub{ font-size:clamp(.76rem, .72rem + .2vw, .86rem); }

  .modal:not(.show){ display:none; }

  body{
    font-family:'DM Sans',sans-serif; color:var(--ink);
    background-color:var(--bg);
    background-image:radial-gradient(rgba(34,30,51,.055) 1px, transparent 1.5px);
    background-size:26px 26px; min-height:100vh;
  }
  .brand-mark{ width:clamp(44px, 3vw, 54px); height:clamp(44px, 3vw, 54px);
    border-radius:14px; flex:none;
    background:var(--naranja); color:var(--naranja-ink); display:grid; place-items:center;
    font-size:clamp(1.2rem, 1rem + .4vw, 1.5rem); }
  .brand-title{ font-family:'Space Grotesk'; font-weight:700; margin:0; }
  .brand-sub{ margin:0; color:var(--ink-soft); }
  .btn-back{ width:42px; height:42px; border-radius:13px; flex:none;
    border:1.5px solid var(--line); background:var(--paper); color:var(--ink);
    display:grid; place-items:center; transition:background .2s, transform .2s; }
  .btn-back:hover{ background:var(--lila); color:var(--lila-ink); transform:translateX(-2px); }

  .btn-primario{ display:inline-flex; align-items:center; gap:8px;
    background:var(--morado); color:#fff; border:none; padding:11px 20px;
    border-radius:999px; font-weight:600; font-size:.92rem;
    box-shadow:0 8px 18px -8px rgba(90,62,166,.55); transition:background .2s; }
  .btn-primario:hover{ background:var(--morado-deep); color:#fff; }
  .btn-primario:disabled{ opacity:.7; }
  .btn-secundario{ display:inline-flex; align-items:center; gap:8px;
    background:var(--paper); color:var(--ink); border:1.5px solid var(--line);
    padding:10px 18px; border-radius:999px; font-weight:600; font-size:.9rem;
    transition:border-color .2s; }
  .btn-secundario:hover{ border-color:var(--morado); color:var(--morado-deep); }
  .btn-secundario:disabled{ opacity:.7; }

  .status-bar{ background:var(--paper); border:1px solid var(--line); border-radius:18px;
    padding:13px 18px; display:flex; align-items:center; gap:13px; flex-wrap:wrap; margin-bottom:16px; }
  .status-dot{ width:10px; height:10px; border-radius:50%; flex:none; }
  .status-dot.ok{ background:#22A06B; box-shadow:0 0 0 4px rgba(34,160,107,.15); }
  .status-dot.warn{ background:#E8A13A; box-shadow:0 0 0 4px rgba(232,161,58,.18); }
  .status-dot.off{ background:var(--rojo); box-shadow:0 0 0 4px rgba(180,35,24,.15); }
  .status-title{ font-weight:700; font-size:.95rem; word-break:break-word; }
  .status-meta{ font-size:.78rem; color:var(--ink-soft); word-break:break-word; }
  .chip{ background:rgba(34,30,51,.05); border-radius:999px; padding:6px 13px;
    font-size:.82rem; font-weight:500; white-space:nowrap; }
  .chip strong{ font-family:'Space Grotesk'; font-weight:700; }

  .tabs{ display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap; }
  .tab-btn{ flex:1 1 220px; border:1.5px solid var(--line); background:var(--paper);
    border-radius:16px; padding:13px 18px; font-weight:600; font-size:.95rem;
    color:var(--ink-soft); cursor:pointer; display:flex; align-items:center;
    gap:9px; justify-content:center; transition:all .2s; }
  .tab-btn.activo{ background:var(--morado); border-color:var(--morado); color:#fff;
    box-shadow:0 8px 18px -8px rgba(90,62,166,.5); }

  .gen-bar{ background:var(--paper); border:1px solid var(--line); border-radius:18px;
    padding:14px 18px; display:grid; gap:12px;
    grid-template-columns:repeat(auto-fit, minmax(160px, 1fr));
    margin-bottom:18px; align-items:end; }
  .gen-field label{ font-size:.7rem; font-weight:700; text-transform:uppercase;
    letter-spacing:.05em; color:var(--ink-soft); display:block; margin-bottom:5px; }
  .gen-input{ width:100%; border:1.5px solid var(--line); border-radius:12px;
    padding:10px 12px; font-size:.95rem; background:var(--bg); }
  .gen-input:focus{ outline:none; border-color:var(--morado); background:#fff;
    box-shadow:0 0 0 4px rgba(107,75,214,.12); }

  .grade-card{ background:var(--paper); border:1px solid var(--line); border-radius:20px;
    overflow:hidden; margin-bottom:20px; box-shadow:0 4px 14px -10px rgba(34,30,51,.18); }
  .grade-head{ display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    padding:14px 20px; border-bottom:1px solid var(--line); }
  .grade-head .g-ico{ width:36px; height:36px; border-radius:11px; flex:none;
    display:grid; place-items:center; font-size:1rem; background:rgba(255,255,255,.7); }
  .grade-head h2{ font-family:'Space Grotesk'; font-weight:700; font-size:1.12rem; margin:0; }
  .gc-naranja{ background:var(--naranja); color:var(--naranja-ink); }
  .gc-morado{ background:var(--morado); color:var(--morado-ink); }
  .gc-morado .g-ico, .gc-morado .grade-count{ background:rgba(255,255,255,.18); color:#fff; }
  .grade-count{ margin-left:auto; background:rgba(255,255,255,.75); border-radius:999px;
    padding:5px 13px; font-size:.82rem; font-weight:600; font-family:'Space Grotesk'; }

  .scroll-x{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .scroll-x::-webkit-scrollbar{ height:8px; }
  .scroll-x::-webkit-scrollbar-thumb{ background:rgba(34,30,51,.15); border-radius:99px; }
  .nota-table{ border-collapse:separate; border-spacing:0; margin:0; font-size:.9rem; }
  .nota-table th{ border-bottom:1px solid var(--line);
    background:rgba(34,30,51,.03); padding:9px 10px; white-space:nowrap; }
  .nota-table td{ border-bottom:1px solid var(--line); padding:5px 6px; }
  .col-nombre{ position:sticky; left:0; z-index:2; min-width:200px; max-width:280px;
    background:var(--paper); font-weight:600; padding:8px 14px;
    border-right:1px solid var(--line); }
  thead .col-nombre{ z-index:4; font-family:'Space Grotesk'; font-weight:600;
    font-size:.74rem; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); }
  .col-res{ position:sticky; right:0; z-index:2; min-width:80px; background:rgba(90,62,166,.06);
    font-family:'Space Grotesk'; font-weight:700; text-align:center; padding:8px 10px;
    border-left:2px solid rgba(90,62,166,.25); }
  thead .col-res{ z-index:4; color:var(--morado-deep); font-size:.74rem;
    text-transform:uppercase; letter-spacing:.05em; }
  .col-calc{ background:rgba(107,75,214,.04); text-align:center; }
  .head-col{ min-width:170px; }
  .head-col .hc-row{ display:flex; align-items:center; gap:6px; }
  .head-col input{ flex:1; min-width:0; border:1.5px solid transparent; background:transparent;
    border-radius:8px; padding:5px 8px; font-family:'Space Grotesk'; font-weight:600;
    font-size:.88rem; color:var(--ink); transition:border .2s, background .2s; }
  .head-col input:hover{ border-color:var(--line); }
  .head-col input:focus{ outline:none; border-color:var(--morado); background:#fff; }
  .head-col input.choca{ border-color:var(--rojo); background:#FDF6F5; }
  .head-col .hc-del{ border:none; background:transparent; color:var(--ink-soft);
    width:24px; height:24px; border-radius:7px; display:grid; place-items:center;
    font-size:.8rem; opacity:.4; transition:all .15s; flex:none; }
  .head-col .hc-del:hover{ opacity:1; background:#FDECEA; color:var(--rojo); }
  .badge-col{ font-size:.6rem; font-weight:700; letter-spacing:.04em;
    background:rgba(34,30,51,.06); color:var(--ink-soft);
    border-radius:999px; padding:2px 8px; flex:none; }
  .c-nota{ width:100%; min-width:60px; border:1.5px solid transparent; background:transparent;
    border-radius:8px; padding:6px; text-align:center; font-family:'Space Grotesk';
    font-weight:600; font-size:.95rem; color:var(--ink); transition:border .2s, background .2s; }
  .c-nota:hover{ border-color:var(--line); }
  .c-nota:focus{ outline:none; border-color:var(--morado); background:#fff;
    box-shadow:0 0 0 3px rgba(107,75,214,.1); }
  .c-nota.mal{ color:var(--rojo); }
  .media-val{ font-size:1.05rem; }
  .media-alta{ color:var(--verde); }
  .media-media{ color:var(--naranja-deep); }
  .media-baja{ color:var(--rojo); }

  .pon-box{ display:flex; flex-direction:column; gap:3px; align-items:center; }
  .pon-box .orden{ display:flex; gap:2px; }
  .pon-box .ord-btn{ border:none; background:transparent; color:var(--ink-soft);
    width:24px; height:20px; border-radius:5px; display:grid; place-items:center;
    font-size:.7rem; cursor:pointer; }
  .pon-box .ord-btn:hover:not(:disabled){ background:rgba(90,62,166,.12); color:var(--morado-deep); }
  .pon-box .ord-btn:disabled{ opacity:.25; cursor:default; }
  .pon-box input{ width:60px; border:1.5px solid var(--line); border-radius:8px;
    padding:4px; text-align:center; font-family:'Space Grotesk'; font-weight:700;
    font-size:.9rem; background:var(--bg); }
  .pon-box input:focus{ outline:none; border-color:var(--morado); background:#fff; }
  .pon-box .pon-lbl{ font-size:.62rem; font-weight:700; color:var(--ink-soft);
    text-transform:uppercase; letter-spacing:.04em; }
  .suma-bar{ display:flex; align-items:center; gap:10px; padding:11px 20px;
    border-bottom:1px solid var(--line); background:rgba(34,30,51,.02);
    font-size:.88rem; font-weight:600; flex-wrap:wrap; }
  .suma-pill{ border-radius:999px; padding:4px 14px; font-family:'Space Grotesk'; font-weight:700; }
  .suma-ok{ background:rgba(23,143,114,.12); color:var(--verde); }
  .suma-mal{ background:rgba(180,35,24,.1); color:var(--rojo); }
  .nota-tri-val{ font-size:1.1rem; }
  .calc-sub{ font-size:.7rem; opacity:.65; display:block; font-weight:600;
    font-family:'Space Grotesk'; font-variant-numeric:tabular-nums; }

  /* Fila de media por actividad (promedio de la clase) */
  .media-clase td{
    background:rgba(107,75,214,.07); font-family:'Space Grotesk';
    font-weight:700; text-align:center; padding:7px 6px;
    border-top:2px solid rgba(90,62,166,.3); }
  .media-clase .col-nombre{ font-style:italic; font-weight:700;
    color:var(--morado-deep); font-size:.85rem; }
  .media-clase .col-res{ color:var(--morado-deep); }

  .empty-card{ background:var(--paper); border:1.5px dashed rgba(34,30,51,.2);
    border-radius:22px; padding:52px 24px; text-align:center; }
  .empty-ico{ width:64px; height:64px; border-radius:20px; margin:0 auto 16px;
    display:grid; place-items:center; font-size:1.7rem;
    background:var(--naranja); color:var(--naranja-ink); }
  .empty-card h3{ font-family:'Space Grotesk'; font-weight:700; font-size:1.25rem; }
  .empty-card p{ color:var(--ink-soft); font-size:.92rem; max-width:52ch; margin:8px auto 20px; }

  .app-modal{ border:none; border-radius:24px; padding:26px 24px 22px; position:relative;
    box-shadow:0 30px 60px -20px rgba(34,30,51,.35); }
  .app-modal .m-close{
    position:absolute; top:13px; right:13px; width:34px; height:34px;
    border:none; border-radius:11px; background:transparent; color:var(--ink-soft);
    display:grid; place-items:center; }
  .app-modal .m-close:hover{ background:rgba(34,30,51,.06); color:var(--ink); }
  .m-head{ display:flex; align-items:center; gap:12px; margin-bottom:6px; }
  .m-icon{ width:44px; height:44px; border-radius:14px; flex:none;
    display:grid; place-items:center; font-size:1.2rem; }
  .m-head h5{ font-family:'Space Grotesk'; font-weight:700; margin:0; font-size:1.15rem; }
  .m-head p{ margin:2px 0 0; font-size:.8rem; color:var(--ink-soft); }
  .frm-label{ font-size:.72rem; font-weight:700; text-transform:uppercase;
    letter-spacing:.05em; color:var(--ink-soft); margin-bottom:5px; display:block; }
  .frm-input{ width:100%; border:1.5px solid var(--line); border-radius:12px;
    padding:10px 13px; font-size:.95rem; background:var(--bg); }
  .frm-input:focus{ outline:none; border-color:var(--lila-deep); background:#fff;
    box-shadow:0 0 0 4px rgba(107,75,214,.12); }
  .btn-aceptar{ width:100%; margin-top:18px; border:none; border-radius:13px;
    background:var(--morado); color:#fff; font-weight:600; padding:12px;
    display:inline-flex; align-items:center; justify-content:center; gap:9px; }
  .btn-aceptar:hover{ background:var(--morado-deep); color:#fff; }
  .btn-aceptar:disabled{ opacity:.75; }
  .btn-peligro{ width:100%; margin-top:10px; border:none; border-radius:13px;
    background:var(--rojo); color:#fff; font-weight:600; padding:12px;
    display:inline-flex; align-items:center; justify-content:center; gap:9px; }
  .btn-peligro:hover{ background:#8F1C13; color:#fff; }
  .btn-cancelar{ width:100%; margin-top:10px; border:1.5px solid var(--line);
    border-radius:13px; background:transparent; color:var(--ink); font-weight:600;
    padding:11px; }
  .btn-cancelar:hover{ background:rgba(34,30,51,.05); }

  .toast-container{ position:fixed; bottom:22px; right:22px; z-index:1080;
    display:flex; flex-direction:column; gap:10px; }
  .app-toast{ display:flex; align-items:center; gap:10px; background:#fff;
    border:1px solid var(--line); border-radius:14px; padding:12px 18px 12px 14px;
    font-size:.9rem; font-weight:500; box-shadow:0 14px 30px -12px rgba(34,30,51,.3);
    opacity:0; transform:translateY(12px); transition:opacity .3s, transform .3s; max-width:360px; }
  .app-toast.show{ opacity:1; transform:none; }
  .toast-success i{ color:#178F72; }
  .toast-warning i{ color:#D9770E; }
  .toast-danger i{ color:#B42318; }

  @media (min-width:992px){
    .status-title{ font-size:1.05rem; }
    .chip{ font-size:.88rem; padding:7px 15px; }
    .tab-btn{ font-size:1.02rem; padding:15px 20px; }
    .grade-head{ padding:16px 24px; }
    .grade-head h2{ font-size:1.3rem; }
    .nota-table{ font-size:.98rem; }
    .col-nombre{ min-width:280px; font-size:1rem; }
    .head-col{ min-width:190px; }
    .head-col input{ font-size:.95rem; }
    .c-nota{ font-size:1.05rem; }
    .media-val{ font-size:1.2rem; }
    .nota-tri-val{ font-size:1.3rem; }
    .calc-sub{ font-size:.78rem; }
  }
  @media (max-width:575.98px){
    .brand-title{ font-size:1.15rem; }
    .status-bar{ padding:11px 12px; }
    .col-nombre{ min-width:140px; font-size:.85rem; padding:7px 10px; }
    .head-col{ min-width:132px; }
    .head-col input{ font-size:.82rem; padding:4px 6px; }
    .c-nota{ min-width:48px; font-size:.9rem; }
    .col-res{ min-width:64px; }
    .btn-back{ width:38px; height:38px; }
    .app-toast{ max-width:calc(100vw - 44px); }
  }

  @media (prefers-reduced-motion:reduce){
    *{ animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="wrap-fluid">
    <div class="d-flex align-items-center gap-3 flex-wrap">
      <a class="btn-back" href="../index.html" aria-label="Volver al panel"><i class="bi bi-arrow-left"></i></a>
      <div class="brand-mark"><i class="bi bi-journal-bookmark"></i></div>
      <div>
        <h1 class="brand-title">Notas</h1>
        <p class="brand-sub">Captura por evaluación y matriz de nota final con ponderaciones</p>
      </div>
      <div class="ms-auto d-flex gap-2 flex-wrap">
        <button class="btn-secundario" id="btnSync"><i class="bi bi-arrow-repeat"></i> Actualizar</button>
        <button class="btn-primario" id="btnGuardar"><i class="bi bi-cloud-arrow-up"></i> Guardar</button>
      </div>
    </div>
  </div>
</header>

<main class="wrap-fluid pb-5">

  <section class="status-bar" aria-live="polite">
    <span class="status-dot warn" id="statusDot"></span>
    <div>
      <div class="status-title" id="statusTitle">Cargando página…</div>
      <div class="status-meta" id="statusMeta"></div>
    </div>
    <div class="ms-auto d-flex gap-2 flex-wrap" id="statusChips"></div>
  </section>

  <section class="tabs">
    <button class="tab-btn activo" id="tabCap"><i class="bi bi-pencil-square"></i> Captura de evaluación</button>
    <button class="tab-btn" id="tabMat"><i class="bi bi-calculator"></i> Matriz de nota final</button>
  </section>

  <!-- ==================== PESTAÑA CAPTURA ==================== -->
  <section id="secCap">
    <section class="gen-bar">
      <div class="gen-field">
        <label for="capAnio">Año</label>
        <input class="gen-input" id="capAnio" type="number" min="2020" max="2100">
      </div>
      <div class="gen-field">
        <label for="capGrado">Grado</label>
        <input class="gen-input" id="capGrado" list="dlGrados" autocomplete="off">
        <datalist id="dlGrados"></datalist>
      </div>
      <div class="gen-field">
        <label for="capTri">Trimestre</label>
        <select class="gen-input" id="capTri">
          <option>1</option><option>2</option><option>3</option>
        </select>
      </div>
      <div class="gen-field">
        <label for="capMat">Materia</label>
        <select class="gen-input" id="capMat"></select>
      </div>
      <div class="gen-field" style="min-width:240px;">
        <label for="capAct">Actividad o evaluación</label>
        <input class="gen-input" id="capAct" list="dlActividades" autocomplete="off"
               placeholder="Nombre de la actividad">
        <datalist id="dlActividades"></datalist>
      </div>
      <div class="gen-field">
        <button class="btn-secundario" id="btnCargarCap" style="width:100%;">
          <i class="bi bi-arrow-return-right"></i> Cargar / crear</button>
      </div>
    </section>

    <section id="capTabla"></section>
  </section>

  <!-- ==================== PESTAÑA MATRIZ ==================== -->
  <section id="secMat" class="d-none">
    <section class="gen-bar">
      <div class="gen-field">
        <label for="matAnio">Año</label>
        <input class="gen-input" id="matAnio" type="number" min="2020" max="2100">
      </div>
      <div class="gen-field">
        <label for="matGrado">Grado</label>
        <input class="gen-input" id="matGrado" list="dlGrados" autocomplete="off">
      </div>
      <div class="gen-field">
        <label for="matTri">Trimestre</label>
        <select class="gen-input" id="matTri">
          <option>1</option><option>2</option><option>3</option>
        </select>
      </div>
      <div class="gen-field">
        <label for="matMat">Materia</label>
        <select class="gen-input" id="matMat"></select>
      </div>
      <div class="gen-field">
        <button class="btn-secundario" id="btnCargarMat" style="width:100%;">
          <i class="bi bi-table"></i> Generar matriz</button>
      </div>
    </section>

    <section id="matTabla"></section>
  </section>
</main>

<!-- Modal: confirmar eliminación de columna -->
<div class="modal fade" id="mdDelCol" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-sm">
    <div class="modal-content app-modal">
      <div class="m-head">
        <div class="m-icon" style="background:#FDECEA; color:var(--rojo);"><i class="bi bi-trash3-fill"></i></div>
        <div><h5>Eliminar columna</h5><p>Quita la actividad y sus notas de la tabla</p></div>
      </div>
      <p class="mb-0" style="font-size:.92rem;" id="delColTexto"></p>
      <button class="btn-peligro" id="btnConfirmarDelCol"><i class="bi bi-trash3"></i> Sí, eliminar</button>
      <button class="btn-cancelar" data-bs-dismiss="modal">Cancelar</button>
    </div>
  </div>
</div>

<!-- Bootstrap JS: primero local (libs/); si falta, CDN -->
<script src="../libs/bootstrap.bundle.min.js"
        onerror="this.onerror=null;var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js';document.head.appendChild(s);"></script>

<script>
/* ============================================================
   DIAGNÓSTICO VISIBLE
   ============================================================ */
window.addEventListener('error', function(ev){
  try{
    var t = document.getElementById('statusTitle');
    var m = document.getElementById('statusMeta');
    var d = document.getElementById('statusDot');
    if(t) t.textContent = 'Error en la página: ' + (ev.message || 'desconocido');
    if(m) m.textContent = 'Línea ' + (ev.lineno || '?') + ' — copia este texto y avísame.';
    if(d) d.className = 'status-dot off';
  }catch(e){}
});

const VERSION = 'v4';

const CONFIG = {
  API_URL:  'https://script.google.com/macros/s/AKfycbz9HoGI3jRz7agpXPgj_5EC-dRHY494kpEfepnemYGQg-N0pqFNYvru5mXRcJEtY-v7/exec',
  DATA_KEY: 'RE_DATA_V1',
  TOKEN_KEY:'RE_TOKEN_V1'
};

const MATERIAS = ['Matemática y Datos', 'Ciencia y Tecnología', 'English'];

const S = {
  token: '', busy: false, tab: 'cap',
  est: [], estPorNie: {}, todasNotas: [],
  cap: { anio:'', grado:'', tri:'1', materia:MATERIAS[0], act:null, columnas:[], celdas:{} },
  mat: { anio:'', grado:'', tri:'1', materia:MATERIAS[0], filas:[], acts:[] },
  delCol: null
};

const $ = s => document.querySelector(s);
function instanciaModal(id){
  if(!window.bootstrap) return null;
  return bootstrap.Modal.getOrCreateInstance(document.getElementById(id));
}
function modalONada(inst){
  if(inst){ inst.show(); return true; }
  toast('Bootstrap JS no cargó: falta libs/bootstrap.bundle.min.js.', 'danger');
  return false;
}

/* ============ UTILIDADES ============ */
function compararTexto(a,b){ return String(a).localeCompare(String(b),'es'); }
function sinTildes(s){
  return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}
function esc(s){
  return String(s ?? '').replace(/[&<>"']/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function hayUrl(){ return CONFIG.API_URL && !CONFIG.API_URL.includes('PEGA_AQUI'); }
async function api(p){
  const r = await fetch(CONFIG.API_URL, { method:'POST', body: JSON.stringify(p) });
  if(!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
function toast(msg, kind='success'){
  const icons = { success:'check-circle-fill', warning:'exclamation-triangle-fill', danger:'x-circle-fill' };
  const el = document.createElement('div');
  el.className = 'app-toast toast-' + kind;
  el.innerHTML = '<i class="bi bi-' + (icons[kind]||icons.success) + '"></i><span></span>';
  el.querySelector('span').textContent = msg;
  $('#toastWrap').appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 350); }, 4200);
}
function claveOrden(e){
  return [e.apellido1,e.apellido2,e.nombre1,e.nombre2]
    .map(sinTildes)
    .map(t => t.split(/\s+/).filter(w => w && w!=='de' && w!=='del').join(' '))
    .join(' ');
}

function parseNota(v){
  if(v === null || v === undefined) return '';
  const s = String(v).trim().replace(',', '.');
  if(s === '') return '';
  const n = parseFloat(s);
  if(isNaN(n) || n < 0 || n > 10) return '';
  return n;
}

/* Sanitiza lo que se teclea: solo dígitos y un punto, máx 2 decimales */
function sanitizarNotaInput(v){
  let s = String(v).replace(/,/g, '.').replace(/[^0-9.]/g, '');
  const partes = s.split('.');
  if(partes.length > 2) s = partes[0] + '.' + partes.slice(1).join('');
  const idx = s.indexOf('.');
  if(idx >= 0) s = s.slice(0, idx + 1 + 2);
  if(s === '.') s = '';
  return s;
}

function fmtNota(n){
  if(n === null || n === undefined || isNaN(n)) return '—';
  return (Math.round(n*100)/100).toLocaleString('es');
}
function claseMedia(m){
  if(m === null || m === undefined || isNaN(m)) return '';
  return m >= 7 ? 'media-alta' : (m >= 6 ? 'media-media' : 'media-baja');
}

/* ============ DATOS ============ */
function leerData(){ try{ return JSON.parse(localStorage.getItem(CONFIG.DATA_KEY)); } catch(e){ return null; } }

function cargarDeLocal(){
  S.token = localStorage.getItem(CONFIG.TOKEN_KEY) || '';
  const d = leerData();
  const estRaw = (d && d.sheets && d.sheets.Estudiantes) || [];
  S.est = estRaw
    .filter(e => String(e.archivado||'') !== 'SI')
    .map(e => ({
      id: String(e.id||''), nie: String(e.nie ?? ''),
      nombre1: e.nombre1||'', nombre2: e.nombre2||'',
      apellido1: e.apellido1||'', apellido2: e.apellido2||'',
      grado: String(e.grado||'').trim() || 'Sin grado',
      nombre: [e.nombre1,e.nombre2,e.apellido1,e.apellido2].filter(Boolean).join(' ')
    }))
    .filter(e => e.id)
    .sort((a,b) => claveOrden(a).localeCompare(claveOrden(b),'es'));
  S.estPorNie = {};
  S.est.forEach(e => { if(e.nie !== '') S.estPorNie[e.nie] = e; });
  S.todasNotas = (d && d.sheets && d.sheets['Notas']) || [];
  return d;
}

/* Cruce de una fila de Notas con el estudiante: por NIE, luego id */
function estDeNotaFila(n){
  return S.estPorNie[String(n.nie ?? '')]
      || S.est.find(e => e.id === String(n.id || ''))
      || null;
}

function notasDe(anio, grado, tri, materia){
  return S.todasNotas.filter(n =>
    String(n.anio) === String(anio) && String(n.grado) === String(grado) &&
    String(n.trimestre) === String(tri) && String(n.materia) === String(materia));
}

function actividadesDe(anio, grado, tri, materia){
  const mapa = {};
  notasDe(anio, grado, tri, materia).forEach(n => {
    const k = String(n.actividad || '');
    if(!k) return;
    if(!mapa[k]) mapa[k] = {
      actividad: k,
      orden: parseInt(n.orden,10) || 0,
      ponderacion: (n.ponderacion === '' || n.ponderacion === undefined || n.ponderacion === null)
        ? null : parseFloat(n.ponderacion)
    };
  });
  return Object.values(mapa)
    .sort((a,b) => a.orden - b.orden || compararTexto(a.actividad, b.actividad));
}
function nombresActividades(anio, grado, tri, materia){
  return actividadesDe(anio, grado, tri, materia).map(a => a.actividad);
}

/* ============ VISTA GENERAL ============ */
function render(){
  try{ renderTabs(); }catch(e){ reportarFalla('tabs', e); }
  try{ renderSelects(); }catch(e){ reportarFalla('selects', e); }
  try{ renderStatus(); }catch(e){ reportarFalla('estado', e); }
}
function reportarFalla(sec, e){
  const dot = $('#statusDot'), tit = $('#statusTitle');
  if(dot) dot.className = 'status-dot off';
  if(tit) tit.textContent = 'Error en la sección ' + sec + ': ' + (e && e.message ? e.message : e);
  console.error('[' + sec + ']', e);
}

function renderTabs(){
  $('#tabCap').classList.toggle('activo', S.tab === 'cap');
  $('#tabMat').classList.toggle('activo', S.tab === 'mat');
  $('#secCap').classList.toggle('d-none', S.tab !== 'cap');
  $('#secMat').classList.toggle('d-none', S.tab !== 'mat');
}

function renderSelects(){
  const grados = [...new Set(S.est.map(e => e.grado))].sort(compararTexto);
  $('#dlGrados').innerHTML = grados.map(g => `<option value="${esc(g)}">`).join('');
  $('#capMat').innerHTML = MATERIAS.map(m => `<option>${esc(m)}</option>`).join('');
  $('#matMat').innerHTML = MATERIAS.map(m => `<option>${esc(m)}</option>`).join('');
  const anioSugerido = String(new Date().getFullYear());
  if(!$('#capAnio').value) $('#capAnio').value = anioSugerido;
  if(!$('#matAnio').value) $('#matAnio').value = anioSugerido;
  renderDatalistActividades();
}

function renderStatus(){
  const dot = $('#statusDot'), tit = $('#statusTitle'), met = $('#statusMeta'), chips = $('#statusChips');
  const data = leerData();
  if(!data){
    dot.className = 'status-dot off';
    tit.textContent = 'Sin conexión con el libro';
    met.textContent = 'Ingresa la contraseña para descargar los datos.';
    chips.innerHTML = '';
    return;
  }
  dot.className = 'status-dot ' + (S.busy ? 'warn' : 'ok');
  tit.textContent = S.busy ? 'Sincronizando con la hoja…' : 'Datos cargados — lectura local instantánea';
  const f = new Date(data.syncedAt);
  met.textContent = 'Última descarga del libro: '
    + f.toLocaleDateString('es',{day:'numeric',month:'short'}) + ', '
    + f.toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'}) + ' · ' + VERSION;
  chips.innerHTML =
    `<span class="chip"><strong>${S.est.length}</strong> estudiantes</span>` +
    `<span class="chip"><strong>${S.todasNotas.length}</strong> notas guardadas</span>`;
}

/* ============ CAPTURA ============ */
function renderDatalistActividades(){
  const act = nombresActividades(
    $('#capAnio').value.trim(), $('#capGrado').value.trim(),
    $('#capTri').value, $('#capMat').value);
  $('#dlActividades').innerHTML = act.map(a => `<option value="${esc(a)}">`).join('');
}

/* Cargar / crear: trae TODAS las actividades guardadas de la
   combinación como columnas editables (en su orden, con notas);
   si no hay nada, crea tabla nueva con el nombre tecleado. */
function cargarCaptura(){
  const anio = $('#capAnio').value.trim();
  const grado = $('#capGrado').value.trim();
  const tri = $('#capTri').value;
  const materia = $('#capMat').value;
  if(!anio || !grado){ toast('Completa año y grado.', 'warning'); return; }
  if(!S.est.some(e => e.grado === grado)){
    toast('No hay estudiantes activos en ese grado.', 'warning'); return;
  }

  S.cap = { anio, grado, tri, materia, act:null, columnas:[], celdas:{} };
  const actNombre = $('#capAct').value.trim();
  const acts = actividadesDe(anio, grado, tri, materia);

  if(acts.length){
    S.cap.columnas = acts.map(a => ({
      nombre: a.actividad, origNombre: a.actividad, existente: true
    }));
    let cargadas = 0;
    notasDe(anio, grado, tri, materia).forEach(n => {
      const e = estDeNotaFila(n);
      if(!e) return;
      const idx = S.cap.columnas.findIndex(c => c.nombre === String(n.actividad || ''));
      if(idx >= 0){
        S.cap.celdas[e.id + '|' + idx] = String(n.nota ?? '');
        cargadas++;
      }
    });
    if(actNombre && acts.some(a => a.actividad === actNombre)) S.cap.act = actNombre;

    let msg = S.cap.columnas.length + ' columna(s) cargadas (' + cargadas + ' notas).';
    if(actNombre && !acts.some(a => a.actividad === actNombre)){
      msg += ' «' + actNombre + '» no existe aún: agrega una columna nueva con ese nombre.';
    }
    toast(msg, 'success');
  }else if(actNombre){
    S.cap.act = actNombre;
    S.cap.columnas = [{ nombre: actNombre, origNombre: actNombre, existente:false }];
    toast('Nueva actividad «' + actNombre + '».', 'success');
  }else{
    toast('Tabla nueva: agrega columnas con + y renómbralas.', 'success');
  }

  renderCapTabla();
}

function addColumna(){
  if(!S.cap.columnas.length){
    const actNombre = $('#capAct').value.trim();
    if(actNombre){
      S.cap.act = actNombre;
      S.cap.columnas = [{ nombre: actNombre, origNombre: actNombre, existente:false }];
    }else{
      S.cap.columnas = [{ nombre:'Actividad 1', origNombre:'Actividad 1', existente:false }];
    }
    renderCapTabla();
    return;
  }
  let n = S.cap.columnas.length + 1;
  let nombre = 'Actividad ' + n;
  while(S.cap.columnas.some(c => c.nombre === nombre)) nombre = 'Actividad ' + (++n);
  S.cap.columnas.push({ nombre, origNombre: nombre, existente:false });
  renderCapTabla();
}

/* Media aritmética de las columnas con nota para un estudiante */
function mediaDe(estId){
  const vals = S.cap.columnas
    .map((c,i) => parseNota(S.cap.celdas[estId + '|' + i] ?? ''))
    .filter(v => v !== '');
  return vals.length ? vals.reduce((a,b) => a+b, 0) / vals.length : null;
}

function renderCapTabla(){
  const cont = $('#capTabla');
  if(!S.cap.columnas.length){
    cont.innerHTML = `
      <div class="empty-card">
        <div class="empty-ico"><i class="bi bi-plus-square"></i></div>
        <h3>Tabla lista para construir</h3>
        <p>Agrega columnas con el botón (+), renómbralas haciendo clic en el
           encabezado y escribe las notas de 0 a 10. La columna MEDIA calcula
           el promedio en tiempo real y se guarda en la hoja junto a cada nota.
           Al guardar, cada columna se registra como una actividad.</p>
        <button class="btn-primario" id="btnAddCol0"><i class="bi bi-plus-lg"></i> Agregar primera columna</button>
      </div>`;
    const b = $('#btnAddCol0'); if(b) b.addEventListener('click', addColumna);
    return;
  }

  let head = '';
  S.cap.columnas.forEach((c, i) => {
    head += `<th class="head-col">
      <div class="hc-row">
        <input type="text" value="${esc(c.nombre)}" data-col="${i}" title="Renombrar columna">
        ${c.existente ? '<span class="badge-col">GUARDADA</span>' : ''}
        <button class="hc-del" data-del="${i}" title="Eliminar columna"><i class="bi bi-x-lg"></i></button>
      </div></th>`;
  });

  let body = '';
  S.est.filter(e => e.grado === S.cap.grado).forEach(e => {
    let tds = '';
    S.cap.columnas.forEach((c, i) => {
      const v = S.cap.celdas[e.id + '|' + i] ?? '';
      tds += `<td><input class="c-nota" data-est="${e.id}" data-col="${i}"
        value="${esc(v)}" inputmode="decimal" placeholder="—"></td>`;
    });
    const m = mediaDe(e.id);
    body += `<tr><td class="col-nombre">${esc(e.nombre)}</td>${tds}
      <td class="col-res"><span class="media-val ${claseMedia(m)}" data-media="${esc(e.id)}">${fmtNota(m)}</span></td></tr>`;
  });

  cont.innerHTML = `
    <article class="grade-card">
      <div class="grade-head gc-naranja">
        <span class="g-ico"><i class="bi bi-pencil-square"></i></span>
        <h2>${esc(S.cap.act || 'Evaluación')}</h2>
        <span class="grade-count">${esc(S.cap.anio)} · ${esc(S.cap.grado)} · Trim ${esc(S.cap.tri)} · ${esc(S.cap.materia)}</span>
      </div>
      <div class="suma-bar">
        <button class="btn-secundario" id="btnAddCol"><i class="bi bi-plus-lg"></i> Agregar columna</button>
        <span style="font-size:.8rem; color:var(--ink-soft);">Notas de 0 a 10 · la MEDIA se calcula en vivo y se guarda en la hoja</span>
      </div>
      <div class="scroll-x">
        <table class="table nota-table">
          <thead><tr><th class="col-nombre">Estudiante</th>${head}
            <th class="col-res">Media</th></tr></thead>
          <tbody>${body}</tbody>
        </table>
      </div>
    </article>`;

  $('#btnAddCol').addEventListener('click', addColumna);
  cont.querySelectorAll('.c-nota').forEach(i => i.addEventListener('input', onNotaInput));
  cont.querySelectorAll('.head-col input').forEach(i => i.addEventListener('input', onRenombrarCol));
  cont.querySelectorAll('.hc-del').forEach(b => b.addEventListener('click', onEliminarCol));
}

function onNotaInput(ev){
  const inp = ev.target;

  /* Sanitizar en vivo: sin texto, un separador, 2 decimales */
  const limpio = sanitizarNotaInput(inp.value);
  if(limpio !== inp.value) inp.value = limpio;

  const estId = inp.dataset.est, colIdx = inp.dataset.col;
  S.cap.celdas[estId + '|' + colIdx] = inp.value;

  const vacio = inp.value.trim() === '';
  const valido = parseNota(inp.value) !== '';
  inp.classList.toggle('mal', !vacio && !valido);

  /* Media de la fila en tiempo real */
  const m = mediaDe(estId);
  const span = document.querySelector('[data-media="' + estId + '"]');
  if(span){
    span.textContent = fmtNota(m);
    span.className = 'media-val ' + claseMedia(m);
  }
}

function onRenombrarCol(ev){
  const idx = parseInt(ev.target.dataset.col, 10);
  if(S.cap.columnas[idx]) S.cap.columnas[idx].nombre = ev.target.value.trim();
  ev.target.classList.toggle('choca', nombreChoca(idx));
}

function nombreChoca(idx){
  const col = S.cap.columnas[idx];
  if(!col) return true;
  const n = col.nombre;
  if(!n) return true;
  if(S.cap.columnas.some((c,i) => i !== idx && c.nombre === n)) return true;
  const enTabla = new Set(S.cap.columnas.map(c => c.nombre));
  const existentes = nombresActividades(S.cap.anio, S.cap.grado, S.cap.tri, S.cap.materia);
  return existentes.some(a => a === n && !enTabla.has(a) && a !== (col.origNombre || col.nombre));
}

function onEliminarCol(ev){
  const idx = parseInt(ev.target.closest('[data-del]').dataset.del, 10);
  const col = S.cap.columnas[idx];
  if(!col) return;
  S.delCol = idx;
  $('#delColTexto').innerHTML = 'Se quitará <strong>' + esc(col.nombre) + '</strong> de la tabla. Al guardar, sus notas dejarán de aparecer en la hoja.';
  modalONada(instanciaModal('mdDelCol'));
}

function confirmarDelCol(){
  if(S.delCol === null) return;
  const idx = S.delCol;
  S.delCol = null;
  S.cap.columnas.splice(idx, 1);
  const nuevo = {};
  Object.keys(S.cap.celdas).forEach(k => {
    const sep = k.lastIndexOf('|');
    const id = k.slice(0, sep), i = parseInt(k.slice(sep+1), 10);
    if(i === idx) return;
    nuevo[id + '|' + (i > idx ? i - 1 : i)] = S.cap.celdas[k];
  });
  S.cap.celdas = nuevo;
  const m = instanciaModal('mdDelCol'); if(m) m.hide();
  renderCapTabla();
}

function validarCaptura(){
  if(!S.cap.columnas.length){ toast('Agrega al menos una columna con notas.', 'warning'); return false; }
  const nombres = [];
  for(let i = 0; i < S.cap.columnas.length; i++){
    const c = S.cap.columnas[i];
    const n = (c.nombre || '').trim();
    if(!n){ toast('Hay columnas sin nombre.', 'warning'); return false; }
    if(nombres.includes(n)){ toast('Columnas con nombre duplicado: «' + n + '».', 'danger'); return false; }
    if(nombreChoca(i)){
      toast('El nombre «' + n + '» entra en conflicto con otra actividad guardada.', 'danger');
      return false;
    }
    nombres.push(n);
  }
  return true;
}

function guardarCaptura(){
  if(!validarCaptura()) return;
  if(!S.token){ abrirPass(); return; }

  const estudiantes = S.est.filter(e => e.grado === S.cap.grado);
  const filas = [];
  estudiantes.forEach(e => {
    const media = mediaDe(e.id);
    const mediaTxt = media === null ? '' : String(Math.round(media*100)/100);
    S.cap.columnas.forEach((c, i) => {
      const v = parseNota(S.cap.celdas[e.id + '|' + i] ?? '');
      if(v === '') return;
      filas.push({
        id: e.id,               // id del ESTUDIANTE (cruce estable)
        anio: S.cap.anio, grado: S.cap.grado,
        trimestre: S.cap.tri, materia: S.cap.materia,
        actividad: c.nombre, orden: i + 1, ponderacion: '',
        nie: e.nie, nombre: e.nombre, nota: v,
        media: mediaTxt
      });
    });
  });

  const actividades = S.cap.columnas.map(c => c.nombre.trim());
  S.cap.columnas.forEach(c => {
    if(c.existente && (c.origNombre || c.nombre) !== c.nombre.trim()){
      actividades.push(c.origNombre || c.nombre);
    }
  });

  enviarNotas(filas, actividades, {
    anio:S.cap.anio, grado:S.cap.grado, trimestre:S.cap.tri, materia:S.cap.materia
  }, 'Captura guardada');
}

/* ============ MATRIZ ============ */
function cargarMatriz(){
  const anio = $('#matAnio').value.trim();
  const grado = $('#matGrado').value.trim();
  const tri = $('#matTri').value;
  const materia = $('#matMat').value;
  if(!anio || !grado){ toast('Completa año y grado.', 'warning'); return; }
  if(!S.est.some(e => e.grado === grado)){
    toast('No hay estudiantes activos en ese grado.', 'warning'); return;
  }

  S.mat = {
    anio, grado, tri, materia,
    acts: actividadesDe(anio, grado, tri, materia).map(a => ({ ...a })),
    filas: []
  };

  if(!S.mat.acts.length){
    $('#matTabla').innerHTML = `
      <div class="empty-card">
        <div class="empty-ico"><i class="bi bi-inboxes"></i></div>
        <h3>Sin actividades guardadas</h3>
        <p>No hay actividades con notas para <strong>${esc(anio)} · ${esc(grado)} ·
           trimestre ${esc(tri)} · ${esc(materia)}</strong>. Créalas en la pestaña
           «Captura de evaluación» y vuelve aquí.</p>
        <button class="btn-primario" id="btnIrCap"><i class="bi bi-pencil-square"></i> Ir a captura</button>
      </div>`;
    $('#btnIrCap').addEventListener('click', () => cambiarTab('cap'));
    return;
  }

  const notasAct = notasDe(anio, grado, tri, materia);
  S.mat.filas = S.est.filter(e => e.grado === grado).map(e => {
    const notas = {};
    notasAct.forEach(n => {
      const due = estDeNotaFila(n);
      if(due && due.id === e.id) notas[String(n.actividad)] = String(n.nota ?? '');
    });
    return { est: e, notas };
  });

  renderMatTabla();
}

function sumaPonderaciones(){
  return S.mat.acts.reduce((s,a) =>
    s + (a.ponderacion !== null && a.ponderacion !== undefined && !isNaN(a.ponderacion) ? a.ponderacion : 0), 0);
}

/* Nota × % ÷ 100; null si falta nota o ponderación */
function calcInd(nota, pon){
  const v = parseNota(nota);
  if(v === '' || pon === null || pon === undefined || isNaN(pon)) return null;
  return Math.round(v * pon) / 100;
}

/* Nota trimestre: suma de las celdas ya ponderadas */
function calcFila(f){
  let total = 0, hay = false;
  S.mat.acts.forEach(a => {
    const c = calcInd(f.notas[a.nombre] ?? '', a.ponderacion);
    if(c !== null){ total += c; hay = true; }
  });
  return hay ? Math.round(total * 100) / 100 : null;
}

/* Media aritmética del estudiante sobre las actividades de la matriz */
function mediaMatDe(f){
  const vals = S.mat.acts
    .map(a => parseNota(f.notas[a.nombre] ?? ''))
    .filter(v => v !== '');
  return vals.length ? vals.reduce((a,b) => a+b, 0) / vals.length : null;
}

function renderMatTabla(){
  const cont = $('#matTabla');
  if(!S.mat.acts.length) return;

  let head = '';
  S.mat.acts.forEach((a, i) => {
    head += `<th class="head-col">
      <div style="display:flex; flex-direction:column; gap:6px; align-items:stretch;">
        <div style="font-family:'Space Grotesk'; font-weight:700; font-size:.9rem; text-align:center;">${esc(a.nombre)}</div>
        <div class="pon-box">
          <div class="orden">
            <button class="ord-btn" data-mv="${i}" data-dir="-1" ${i === 0 ? 'disabled' : ''} title="Mover izquierda"><i class="bi bi-arrow-left"></i></button>
            <button class="ord-btn" data-mv="${i}" data-dir="1" ${i === S.mat.acts.length - 1 ? 'disabled' : ''} title="Mover derecha"><i class="bi bi-arrow-right"></i></button>
          </div>
          <input type="number" min="0" max="100" step="0.5"
            value="${a.ponderacion === null ? '' : a.ponderacion}"
            data-pon="${i}" placeholder="%" title="Ponderación en %">
          <span class="pon-lbl">%</span>
        </div>
      </div></th>`;
  });

  let body = '';
  S.mat.filas.forEach(f => {
    let tds = '';
    S.mat.acts.forEach(a => {
      const v = f.notas[a.nombre] ?? '';
      const c = calcInd(v, a.ponderacion);
      tds += `<td class="col-calc">
        <input class="c-nota" data-est="${esc(f.est.id)}" data-act="${esc(a.nombre)}"
          value="${esc(v)}" inputmode="decimal" placeholder="—">
        <small class="calc-sub">${c !== null ? fmtNota(c) : '—'}</small></td>`;
    });
    const tri = calcFila(f);
    body += `<tr><td class="col-nombre">${esc(f.est.nombre)}</td>${tds}
      <td class="col-res"><span class="nota-tri-val ${claseMedia(tri)}">${fmtNota(tri)}</span></td></tr>`;
  });

  const suma = Math.round(sumaPonderaciones() * 100) / 100;
  cont.innerHTML = `
    <article class="grade-card">
      <div class="grade-head gc-morado">
        <span class="g-ico"><i class="bi bi-calculator"></i></span>
        <h2>Nota final · ${esc(S.mat.materia)}</h2>
        <span class="grade-count">${esc(S.mat.anio)} · ${esc(S.mat.grado)} · Trim ${esc(S.mat.tri)} · ${S.mat.acts.length} act.</span>
      </div>
      <div class="suma-bar">
        <span>Suma de ponderaciones:</span>
        <span class="suma-pill ${Math.abs(suma - 100) < 0.01 ? 'suma-ok' : 'suma-mal'}" id="sumaPill">${fmtNota(suma)}%</span>
        <span style="font-size:.8rem; color:var(--ink-soft);" id="sumaHint"></span>
        <button class="btn-secundario ms-auto" id="btnCopiarMat"><i class="bi bi-clipboard"></i> Copiar matriz</button>
      </div>
      <div class="scroll-x">
        <table class="table nota-table">
          <thead><tr><th class="col-nombre">Estudiante</th>${head}
            <th class="col-res">Nota trimestre</th></tr></thead>
          <tbody>${body}</tbody>
          <tfoot><tr class="media-clase">
            <td class="col-nombre">Media de la clase</td>
            ${S.mat.acts.map((a, i) => `<td class="col-calc" data-mact="${i}">—</td>`).join('')}
            <td class="col-res" data-mfinal>—</td>
          </tr></tfoot>
        </table>
      </div>
    </article>`;

  cont.querySelectorAll('.c-nota').forEach(i => i.addEventListener('input', onNotaMat));
  cont.querySelectorAll('[data-pon]').forEach(i => i.addEventListener('input', onPonInput));
  cont.querySelectorAll('[data-mv]').forEach(b => b.addEventListener('click', ev => {
    const btn = ev.currentTarget;
    moverAct(parseInt(btn.dataset.mv,10), parseInt(btn.dataset.dir,10));
  }));
  $('#btnCopiarMat').addEventListener('click', copiarMatriz);

  recalcPill();
  recalcMatriz();   // pinta los cálculos ya cargados al generar
}

/* RECALCULADOR GLOBAL EN VIVO — sin re-render: recorre todas las
   celdas y actualiza subcálculos, nota trimestre, fila de medias
   y pill. Se llama con cada tecla (nota o ponderación). */
function recalcMatriz(){
  const tabla = $('#matTabla');
  if(!tabla || !S.mat.acts.length) return;

  /* Celdas: nota × % ÷ 100, por cada estudiante */
  tabla.querySelectorAll('.c-nota').forEach(inp => {
    const f = S.mat.filas.find(x => x.est.id === inp.dataset.est);
    if(!f) return;
    inp.classList.toggle('mal', inp.value.trim() !== '' && parseNota(inp.value) === '');
    if(!(inp.dataset.act in f.notas)) return;
    const act = S.mat.acts.find(a => a.nombre === inp.dataset.act);
    const c = calcInd(f.notas[inp.dataset.act] ?? '', act ? act.ponderacion : null);
    const sm = inp.closest('td').querySelector('.calc-sub');
    if(sm) sm.textContent = c !== null ? fmtNota(c) : '—';
  });

  /* Nota trimestre por estudiante */
  tabla.querySelectorAll('.nota-tri-val').forEach(span => {
    const tr = span.closest('tr');
    const primerInput = tr && tr.querySelector('.c-nota');
    if(!primerInput) return;
    const f = S.mat.filas.find(x => x.est.id === primerInput.dataset.est);
    if(!f) return;
    const tri = calcFila(f);
    span.textContent = fmtNota(tri);
    span.className = 'nota-tri-val ' + claseMedia(tri);
  });

  /* Fila de media por actividad + media de notas finales */
  S.mat.acts.forEach((a, i) => {
    const vals = S.mat.filas
      .map(f => parseNota(f.notas[a.nombre] ?? ''))
      .filter(v => v !== '');
    const m = vals.length ? vals.reduce((x,y) => x+y, 0) / vals.length : null;
    const el = tabla.querySelector('[data-mact="' + i + '"]');
    if(el){
      el.textContent = fmtNota(m);
      el.className = 'col-calc ' + claseMedia(m);
    }
  });
  const finales = S.mat.filas.map(f => calcFila(f)).filter(v => v !== null);
  const mfEl = tabla.querySelector('[data-mfinal]');
  if(mfEl){
    const mf = finales.length ? finales.reduce((x,y) => x+y, 0) / finales.length : null;
    mfEl.textContent = fmtNota(mf);
    mfEl.className = 'col-res ' + claseMedia(mf);
  }
}

function recalcPill(){
  const suma = Math.round(sumaPonderaciones() * 100) / 100;
  const pill = $('#sumaPill');
  const hint = $('#sumaHint');
  if(pill){
    pill.textContent = fmtNota(suma) + '%';
    pill.className = 'suma-pill ' + (Math.abs(suma - 100) < 0.01 ? 'suma-ok' : 'suma-mal');
  }
  if(hint){
    const faltan = S.mat.acts.filter(a => a.ponderacion === null || a.ponderacion === undefined || isNaN(a.ponderacion)).length;
    hint.textContent = faltan
      ? 'Faltan ' + faltan + ' ponderación(es) por asignar.'
      : (Math.abs(suma - 100) < 0.01
        ? 'Ponderaciones completas: los cálculos son definitivos.'
        : 'La suma debe ser 100% para el cálculo definitivo.');
  }
}

function onNotaMat(ev){
  const inp = ev.target;

  /* Sanitizar en vivo: sin texto, un separador, 2 decimales */
  const limpio = sanitizarNotaInput(inp.value);
  if(limpio !== inp.value) inp.value = limpio;

  const f = S.mat.filas.find(x => x.est.id === inp.dataset.est);
  if(!f) return;
  f.notas[inp.dataset.act] = inp.value;

  recalcMatriz();
}

function onPonInput(ev){
  const a = S.mat.acts[parseInt(ev.target.dataset.pon, 10)];
  if(!a) return;
  a.ponderacion = ev.target.value === '' ? null : parseFloat(ev.target.value);
  recalcPill();
  recalcMatriz();   // recálculo inmediato de TODAS las celdas, sin re-render
}

function moverAct(i, dir){
  const j = i + dir;
  if(j < 0 || j >= S.mat.acts.length) return;
  const t = S.mat.acts[i];
  S.mat.acts[i] = S.mat.acts[j];
  S.mat.acts[j] = t;
  S.mat.acts.forEach((a, k) => a.orden = k + 1);
  renderMatTabla();
}

function guardarMatriz(){
  if(!S.mat.acts.length){ toast('Genera la matriz primero.', 'warning'); return; }
  if(!S.token){ abrirPass(); return; }

  let faltaPon = false;
  const suma = sumaPonderaciones();
  S.mat.acts.forEach(a => {
    if(a.ponderacion === null || a.ponderacion === undefined || isNaN(a.ponderacion)) faltaPon = true;
  });
  if(faltaPon){ toast('Asigna la ponderación (%) de todas las actividades.', 'warning'); return; }
  if(suma > 100.01){ toast('La suma de ponderaciones (' + fmtNota(suma) + '%) excede el 100%.', 'danger'); return; }
  if(Math.abs(suma - 100) > 0.01){
    toast('La suma de ponderaciones es ' + fmtNota(suma) + '% (ideal: 100%). Se guardará así.', 'warning');
  }

  const filas = [];
  S.mat.filas.forEach(f => {
    const media = mediaMatDe(f);
    const mediaTxt = media === null ? '' : String(Math.round(media*100)/100);
    S.mat.acts.forEach((a, i) => {
      const v = parseNota(f.notas[a.nombre] ?? '');
      if(v === '') return;
      filas.push({
        id: f.est.id,           // id del ESTUDIANTE
        anio: S.mat.anio, grado: S.mat.grado,
        trimestre: S.mat.tri, materia: S.mat.materia,
        actividad: a.nombre, orden: i + 1,
        ponderacion: a.ponderacion,
        nie: f.est.nie, nombre: f.est.nombre, nota: v,
        media: mediaTxt
      });
    });
  });

  enviarNotas(filas, S.mat.acts.map(a => a.nombre), {
    anio:S.mat.anio, grado:S.mat.grado, trimestre:S.mat.tri, materia:S.mat.materia
  }, 'Matriz guardada');
}

async function copiarMatriz(){
  const lineas = [];
  lineas.push(['Estudiante',
    ...S.mat.acts.map(a => a.nombre), 'Nota trimestre'].join('\t'));
  lineas.push(['Ponderación',
    ...S.mat.acts.map(a => (a.ponderacion === null ? '' : a.ponderacion + '%')), ''].join('\t'));
  S.mat.filas.forEach(f => {
    const tri = calcFila(f);
    lineas.push([
      f.est.nombre,
      ...S.mat.acts.map(a => (f.notas[a.nombre] ?? '')),
      ...S.mat.acts.map(a => {
        const c = calcInd(f.notas[a.nombre] ?? '', a.ponderacion);
        return c !== null ? fmtNota(c) : '';
      }),
      tri !== null ? fmtNota(tri) : ''
    ].join('\t'));
  });
  const texto = lineas.join('\n');
  try{
    await navigator.clipboard.writeText(texto);
    toast('Matriz copiada: pégala en Word, Sheets o donde quieras.', 'success');
  }catch(e){
    const ta = document.createElement('textarea');
    ta.value = texto;
    document.body.appendChild(ta);
    ta.select();
    try{ document.execCommand('copy'); toast('Matriz copiada.', 'success'); }
    catch(e2){ toast('No pude copiar al portapapeles.', 'danger'); }
    ta.remove();
  }
}

/* ============ GUARDADO COMÚN ============ */
async function enviarNotas(filas, actividades, clave, msgOk){
  const btn = $('#btnGuardar');
  btn.disabled = true;
  try{
    const r = await api({ action:'notas_set', token:S.token, clave, filas, actividades });
    if(r && r.ok){
      toast(msgOk + ' (' + r.escritas + ' notas).', 'success');
      await refrescar(true);   // refresca el caché con lo recién guardado
      return true;
    }
    toast('El servidor rechazó el guardado: ' + ((r && r.error) || 'error'), 'danger');
  }catch(e){
    toast('Sin conexión al guardar. Revisa tu internet.', 'danger');
  }
  btn.disabled = false;
  return false;
}

/* ============ LOGIN / SINCRONIZACIÓN ============ */
function abrirPass(){
  const m = instanciaModal('mdPass');
  if(!modalONada(m)) return;
  $('#passError').classList.remove('visible');
  $('#inpPass').value = '';
  setTimeout(() => $('#inpPass').focus(), 400);
}

async function onSubmitPass(e){
  e.preventDefault();
  const pw = $('#inpPass').value;
  if(!pw){ $('#passError').textContent = 'Escribe la contraseña.'; $('#passError').classList.add('visible'); return; }

  $('#btnPassSubmit').disabled = true;
  $('#btnPassSubmit .spinner-border').classList.remove('d-none');
  try{
    const r = await api({ action:'login', password: pw });
    if(r && r.ok){
      localStorage.setItem(CONFIG.TOKEN_KEY, r.token);
      localStorage.setItem(CONFIG.DATA_KEY, JSON.stringify(r.data));
      S.token = r.token;
      cargarDeLocal();
      render();
      const mp = instanciaModal('mdPass'); if(mp) mp.hide();
      toast('Conectado: datos descargados en este dispositivo.', 'success');
    }else{
      $('#passError').textContent = (r && r.error === 'CONTRASENA_INCORRECTA')
        ? 'Contraseña incorrecta.' : ((r && r.error) || 'Respuesta inesperada.');
      $('#passError').classList.add('visible');
    }
  }catch(e2){
    $('#passError').textContent = 'No pude conectar con el servidor.';
    $('#passError').classList.add('visible');
  }
  $('#btnPassSubmit').disabled = false;
  $('#btnPassSubmit .spinner-border').classList.add('d-none');
}

async function refrescar(silencioso){
  if(!hayUrl()){
    if(!silencioso) toast('Primero pega la URL del Web App en CONFIG.API_URL.', 'warning');
    return;
  }
  if(!S.token){
    if(!silencioso) abrirPass();
    return;
  }
  S.busy = true; renderStatus();
  try{
    const r = await api({ action:'sync', token: S.token });
    if(r && r.ok){
      localStorage.setItem(CONFIG.DATA_KEY, JSON.stringify(r.data));
      cargarDeLocal();
      if(!silencioso) toast('Datos actualizados desde la hoja de cálculo.', 'success');
    }else{
      localStorage.removeItem(CONFIG.TOKEN_KEY); S.token = '';
      if(!silencioso) abrirPass();
    }
  }catch(e){
    if(!silencioso) toast('No pude conectar con el servidor; muestro la última copia local.', 'warning');
  }
  S.busy = false; renderStatus();
}

function cambiarTab(tab){
  S.tab = tab;
  renderTabs();
}

/* ============ INICIO — blindado ============ */
function init(){
  const data0 = leerData();
  if(data0){
    $('#statusTitle').textContent = 'Datos cargados — preparando vista…';
    $('#statusDot').className = 'status-dot ok';
  }else{
    $('#statusTitle').textContent = 'Sin datos todavía';
    $('#statusDot').className = 'status-dot off';
  }

  cargarDeLocal();
  render();

  $('#tabCap').addEventListener('click', () => cambiarTab('cap'));
  $('#tabMat').addEventListener('click', () => cambiarTab('mat'));

  $('#btnCargarCap').addEventListener('click', cargarCaptura);
  $('#btnCargarMat').addEventListener('click', cargarMatriz);
  $('#btnSync').addEventListener('click', () => refrescar(false));
  $('#btnGuardar').addEventListener('click', () => {
    S.tab === 'cap' ? guardarCaptura() : guardarMatriz();
  });

  ['capAnio','capGrado'].forEach(id =>
    $('#'+id).addEventListener('input', renderDatalistActividades));
  ['capTri','capMat'].forEach(id =>
    $('#'+id).addEventListener('change', renderDatalistActividades));

  $('#btnConfirmarDelCol').addEventListener('click', confirmarDelCol);
  $('#frmPass').addEventListener('submit', onSubmitPass);

  refrescar(true);
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', init);
}else{
  init();
}
</script>
</body>
</html>
